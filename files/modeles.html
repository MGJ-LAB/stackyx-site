<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>Modèles 3D - Stackyx Files</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-area="files" data-page="f-models" data-root="../">
<div id="site-header"></div>
<main>
  <div class="wrap page">
    <div class="page-head">
      <div>
        <h1>Modèles 3D</h1>
        <p>Télécharge des fichiers STL, 3MF, OBJ et STEP partagés par la communauté. Inscription obligatoire pour télécharger.</p>
      </div>
      <a class="btn btn-gold" href="publier.html?type=model">Vendre un modèle</a>
    </div>

    <div class="filters">
      <input class="field" id="modelSearch" type="search" placeholder="Rechercher un modèle, un créateur, un mot-clé..." aria-label="Rechercher un modèle">
      <select class="select" id="catFilter" aria-label="Catégorie"></select>
      <select class="select" id="fmtFilter" aria-label="Format">
        <option value="">Tous les formats</option>
        <option>STL</option>
        <option>3MF</option>
        <option>OBJ</option>
        <option>STEP</option>
      </select>
      <select class="select" id="sortFilter" aria-label="Trier par">
        <option value="pop">Les plus populaires</option>
        <option value="rated">Les mieux notés</option>
        <option value="new">Les plus récents</option>
        <option value="asc">Prix croissant</option>
        <option value="desc">Prix décroissant</option>
      </select>
    </div>
    <p class="muted small" id="modelCount" style="margin-bottom:12px"></p>
    <div class="grid g3" id="modelList"></div>
  </div>
</main>
<div id="site-footer"></div>
<script src="../js/app.js"></script>
</body>
</html>
